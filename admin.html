<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Night Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background-color:#1a472a;background-image:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(0,0,0,0.08) 40px,rgba(0,0,0,0.08) 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(0,0,0,0.08) 40px,rgba(0,0,0,0.08) 41px);font-family:Arial,sans-serif;color:#f5f0e8;padding:2rem 1rem 4rem}
.wrap{max-width:480px;margin:0 auto}
h1{text-align:center;color:#f5d87a;font-size:2rem;margin-bottom:0.25rem}
p.sub{text-align:center;color:rgba(245,240,232,0.5);font-size:0.8rem;margin-bottom:1.5rem;text-transform:uppercase;letter-spacing:0.1em}
.card{background:rgba(0,0,0,0.4);border:1px solid rgba(245,216,122,0.3);border-radius:10px;padding:1.5rem;margin-bottom:1.25rem}
h2{color:#f5d87a;margin:0 0 1.25rem;font-size:1.1rem}
label{display:block;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:#f5d87a;margin-bottom:0.3rem;margin-top:0.9rem}
label:first-of-type{margin-top:0}
input[type="text"],input[type="password"],select,textarea{width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(245,216,122,0.3);border-radius:6px;padding:0.65rem 0.9rem;color:#f5f0e8;font-size:0.95rem;font-family:Arial,sans-serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:#f5d87a}
select option{background:#1a472a;color:#f5f0e8}
textarea{resize:vertical;min-height:70px}
.btn-green{width:100%;margin-top:1.25rem;background:#2d6a4f;color:#f5f0e8;border:1px solid #52b788;border-radius:6px;padding:0.75rem;font-size:1rem;font-weight:bold;cursor:pointer}
.btn-green:hover{opacity:0.85}
.btn-red{width:100%;margin-top:0.75rem;background:rgba(180,40,40,0.5);color:#f5f0e8;border:1px solid rgba(230,80,80,0.5);border-radius:6px;padding:0.65rem;font-size:0.9rem;font-weight:bold;cursor:pointer}
.btn-red:hover{opacity:0.85}
.msg{text-align:center;margin-top:0.75rem;font-size:0.88rem;min-height:1.2em;color:#f5d87a}
.date-row{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.winner-row{display:flex;gap:0.5rem}
.winner-row select,.winner-row input{flex:1}
#admin-section{display:none}
.footer-links{text-align:center;margin-top:1rem;font-size:0.78rem}
.footer-links a{color:rgba(245,216,122,0.5);text-decoration:none}
.footer-links a:hover{color:#f5d87a}
.day-label{background:rgba(245,216,122,0.1);border:1px solid rgba(245,216,122,0.2);border-radius:6px;padding:0.5rem 0.9rem;font-size:0.9rem;color:#f5d87a;margin-top:0.35rem;min-height:2rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Poker Night</h1>
  <p class="sub">Admin Panel</p>

  <!-- LOGIN -->
  <div id="login-section" class="card">
    <h2>Commissioner Access</h2>
    <label>Password</label>
    <input type="password" id="pw" placeholder="Enter password"/>
    <button class="btn-green" onclick="login()">Enter</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- WINNER QUESTION -->
  <div id="winner-section" class="card" style="display:none">
    <h2>Who won last poker night?</h2>
    <label>Select from last game's attendees or type a name</label>
    <div class="winner-row">
      <select id="winner-select" onchange="winnerSelected()">
        <option value="">-- Select a player --</option>
      </select>
      <input type="text" id="winner-text" placeholder="Or type name"/>
    </div>
    <button class="btn-green" onclick="confirmWinner()">Confirm Winner</button>
    <div class="msg" id="winner-msg"></div>
  </div>

  <!-- ADMIN FORM -->
  <div id="admin-section" class="card">
    <h2>Update Game Details</h2>

    <label>Game Date</label>
    <select id="f-date-select" onchange="dateSelected()">
      <option value="">-- Select a scheduled date --</option>
      <option value="Wednesday, July 8, 2026">Wednesday, July 8, 2026</option>
      <option value="Wednesday, August 19, 2026">Wednesday, August 19, 2026</option>
      <option value="Wednesday, September 9, 2026">Wednesday, September 9, 2026</option>
      <option value="Wednesday, October 14, 2026">Wednesday, October 14, 2026</option>
      <option value="custom">Pick a different date...</option>
    </select>

    <div id="custom-date-wrap" style="display:none;margin-top:0.5rem">
      <label>Pick Any Date</label>
      <input type="date" id="f-date-custom" onchange="customDateChanged()" style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(245,216,122,0.3);border-radius:6px;padding:0.65rem 0.9rem;color:#f5f0e8;font-size:0.95rem"/>
      <div class="day-label" id="day-label">Day will appear here</div>
    </div>

    <label>Host Name</label>
    <input type="text" id="f-host" placeholder="e.g. Randy LeClaire"/>

    <label>Address</label>
    <input type="text" id="f-address" placeholder="e.g. 123 Main St, Morgan Hill, CA"/>

    <label>Time</label>
    <select id="f-time">
      <option value="6:00 PM – 11:00 PM">6:00 PM – 11:00 PM (default)</option>
      <option value="5:00 PM – 10:00 PM">5:00 PM – 10:00 PM</option>
      <option value="6:00 PM – 10:00 PM">6:00 PM – 10:00 PM</option>
      <option value="7:00 PM – 11:00 PM">7:00 PM – 11:00 PM</option>
      <option value="7:00 PM – Midnight">7:00 PM – Midnight</option>
    </select>

    <label>Grub (last winner brings food)</label>
    <input type="text" id="f-food" placeholder="e.g. Dennis Montero"/>

    <label>Funny Note (optional — shows on RSVP page)</label>
    <textarea id="f-note" placeholder="e.g. Bring your poker face and leave your excuses at home..."></textarea>

    <button class="btn-green" onclick="saveDetails()">Save Game Details</button>
    <button class="btn-red" onclick="clearRsvps()">Clear RSVP List for New Game</button>
    <div class="msg" id="admin-msg"></div>
  </div>

  <div class="footer-links">
    <a href="index.html">← Back to RSVP Page</a>
  </div>
</div>

<script>
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbz0-b_wivdSlEUA4OAjEzW3d3aP1bLbKUT4b554jtI8QNZtwWrHfmLWaSRPnDQocTonRg/exec';
var PASSWORD='Poker26';
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function login(){
  var pw=document.getElementById('pw').value;
  if(pw===PASSWORD){
    document.getElementById('login-section').style.display='none';
    document.getElementById('winner-section').style.display='block';
    loadLastAttendees();
  }else{
    document.getElementById('login-msg').textContent='Wrong password. Try again.';
    document.getElementById('login-msg').style.color='#e07070';
  }
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')login();});

async function loadLastAttendees(){
  try{
    var res=await fetch(SCRIPT_URL+'?action=getAll');
    var data=await res.json();
    var sel=document.getElementById('winner-select');
    var inPlayers=(data.attendees||[]).filter(function(a){return a.status==='in';});
    inPlayers.forEach(function(a){
      var opt=document.createElement('option');
      opt.value=a.name;
      opt.textContent=a.name;
      sel.appendChild(opt);
    });
  }catch(e){}
}

function winnerSelected(){
  var val=document.getElementById('winner-select').value;
  if(val)document.getElementById('winner-text').value=val;
}

function confirmWinner(){
  var name=document.getElementById('winner-text').value.trim()||document.getElementById('winner-select').value;
  if(!name){
    document.getElementById('winner-msg').textContent='Please select or type a name.';
    document.getElementById('winner-msg').style.color='#e07070';
    return;
  }
  document.getElementById('f-food').value=name;
  document.getElementById('winner-section').style.display='none';
  document.getElementById('admin-section').style.display='block';
  loadCurrent(name);
}

async function loadCurrent(winnerOverride){
  try{
    var res=await fetch(SCRIPT_URL+'?action=getSettings');
    var data=await res.json();
    var s=data.settings||{};
    // Set date dropdown
    var sel=document.getElementById('f-date-select');
    var matched=false;
    for(var i=0;i<sel.options.length;i++){
      if(sel.options[i].value===s.date){sel.selectedIndex=i;matched=true;break;}
    }
    if(!matched&&s.date){
      sel.value='custom';
      document.getElementById('custom-date-wrap').style.display='block';
    }
    document.getElementById('f-host').value=s.host||'';
    document.getElementById('f-address').value=s.address||'';
    // Set time dropdown
    var tsel=document.getElementById('f-time');
    for(var j=0;j<tsel.options.length;j++){
      if(tsel.options[j].value===s.time){tsel.selectedIndex=j;break;}
    }
    document.getElementById('f-food').value=winnerOverride||s.food||'';
    document.getElementById('f-note').value=s.note||'';
  }catch(e){}
}

function dateSelected(){
  var val=document.getElementById('f-date-select').value;
  if(val==='custom'){
    document.getElementById('custom-date-wrap').style.display='block';
  }else{
    document.getElementById('custom-date-wrap').style.display='none';
  }
}

function customDateChanged(){
  var d=new Date(document.getElementById('f-date-custom').value+'T12:00:00');
  if(!isNaN(d)){
    document.getElementById('day-label').textContent=DAYS[d.getDay()]+', '+d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  }
}

function getSelectedDate(){
  var sel=document.getElementById('f-date-select');
  if(sel.value==='custom'){
    var d=new Date(document.getElementById('f-date-custom').value+'T12:00:00');
    if(!isNaN(d))return DAYS[d.getDay()]+', '+d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    return '';
  }
  return sel.value;
}

function saveDetails(){
  var msg=document.getElementById('admin-msg');
  msg.style.color='rgba(245,240,232,0.5)';
  msg.textContent='Saving...';
  var settings={
    date:getSelectedDate(),
    host:document.getElementById('f-host').value.trim(),
    address:document.getElementById('f-address').value.trim(),
    time:document.getElementById('f-time').value,
    food:document.getElementById('f-food').value.trim(),
    note:document.getElementById('f-note').value.trim()
  };
  fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'saveSettings',settings:settings})})
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.success){msg.style.color='#52b788';msg.textContent='Done! RSVP page is updated.';}
    else{msg.style.color='#e07070';msg.textContent='Something went wrong. Try again.';}
  })
  .catch(function(){msg.style.color='#e07070';msg.textContent='Could not connect. Check your internet.';});
}

function clearRsvps(){
  if(!confirm('Clear the entire RSVP list for the new game?'))return;
  var msg=document.getElementById('admin-msg');
  msg.style.color='rgba(245,240,232,0.5)';
  msg.textContent='Clearing...';
  fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'clearRsvps'})})
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.success){msg.style.color='#52b788';msg.textContent='RSVP list cleared. Fresh start!';}
  })
  .catch(function(){msg.style.color='#e07070';msg.textContent='Could not connect. Try again.';});
}
</script>
</body>
</html>
