<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Night Admin</title>
<style>
body {
  min-height: 100vh;
  background-color: #1a472a;
  font-family: Arial, sans-serif;
  color: #f5f0e8;
  padding: 2rem 1rem;
  margin: 0;
}
.wrap {
  max-width: 480px;
  margin: 0 auto;
}
h1 {
  text-align: center;
  color: #f5d87a;
  font-size: 2rem;
  margin-bottom: 0.25rem;
}
p.sub {
  text-align: center;
  color: rgba(245,240,232,0.5);
  font-size: 0.8rem;
  margin-bottom: 2rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.card {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(245,216,122,0.3);
  border-radius: 10px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}
h2 {
  color: #f5d87a;
  margin: 0 0 1.25rem;
  font-size: 1.1rem;
}
label {
  display: block;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #f5d87a;
  margin-bottom: 0.3rem;
  margin-top: 0.9rem;
}
label:first-of-type {
  margin-top: 0;
}
input {
  width: 100%;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(245,216,122,0.3);
  border-radius: 6px;
  padding: 0.65rem 0.9rem;
  color: #f5f0e8;
  font-size: 0.95rem;
  box-sizing: border-box;
}
input:focus {
  outline: none;
  border-color: #f5d87a;
}
.btn-green {
  width: 100%;
  margin-top: 1.25rem;
  background: #2d6a4f;
  color: #f5f0e8;
  border: 1px solid #52b788;
  border-radius: 6px;
  padding: 0.75rem;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
}
.btn-green:hover { opacity: 0.85; }
.btn-red {
  width: 100%;
  margin-top: 0.75rem;
  background: rgba(180,40,40,0.5);
  color: #f5f0e8;
  border: 1px solid rgba(230,80,80,0.5);
  border-radius: 6px;
  padding: 0.65rem;
  font-size: 0.9rem;
  font-weight: bold;
  cursor: pointer;
}
.btn-red:hover { opacity: 0.85; }
.msg {
  text-align: center;
  margin-top: 0.75rem;
  font-size: 0.88rem;
  min-height: 1.2em;
  color: #f5d87a;
}
#admin-section { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Poker Night</h1>
  <p class="sub">Admin Panel</p>

  <div id="login-section" class="card">
    <h2>Commissioner Access</h2>
    <label>Password</label>
    <input type="password" id="pw" placeholder="Enter password" />
    <button class="btn-green" onclick="login()">Enter</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <div id="admin-section" class="card">
    <h2>Update Game Details</h2>
    <label>Date</label>
    <input type="text" id="f-date" placeholder="e.g. Wednesday, August 19" />
    <label>Host Name</label>
    <input type="text" id="f-host" placeholder="e.g. Randy LeClaire" />
    <label>Address</label>
    <input type="text" id="f-address" placeholder="e.g. 123 Main St, Morgan Hill, CA" />
    <label>Time</label>
    <input type="text" id="f-time" placeholder="e.g. 6:00 PM - 11:00 PM" />
    <label>Food (last winner's name)</label>
    <input type="text" id="f-food" placeholder="e.g. Dennis Montero" />
    <button class="btn-green" onclick="saveDetails()">Save Game Details</button>
    <button class="btn-red" onclick="clearRsvps()">Clear RSVP List for New Game</button>
    <div class="msg" id="admin-msg"></div>
  </div>
</div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0-b_wivdSlEUA4OAjEzW3d3aP1bLbKUT4b554jtI8QNZtwWrHfmLWaSRPnDQocTonRg/exec';
var PASSWORD = 'Poker26';

function login() {
  var pw = document.getElementById('pw').value;
  if (pw === PASSWORD) {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('admin-section').style.display = 'block';
    loadCurrent();
  } else {
    document.getElementById('login-msg').textContent = 'Wrong password. Try again.';
    document.getElementById('login-msg').style.color = '#e07070';
  }
}

document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') login();
});

function loadCurrent() {
  fetch(SCRIPT_URL + '?action=getSettings')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var s = data.settings || {};
      document.getElementById('f-date').value = s.date || '';
      document.getElementById('f-host').value = s.host || '';
      document.getElementById('f-address').value = s.address || '';
      document.getElementById('f-time').value = s.time || '';
      document.getElementById('f-food').value = s.food || '';
    })
    .catch(function() {});
}

function saveDetails() {
  var msg = document.getElementById('admin-msg');
  msg.style.color = 'rgba(245,240,232,0.5)';
  msg.textContent = 'Saving...';
  var settings = {
    date: document.getElementById('f-date').value.trim(),
    host: document.getElementById('f-host').value.trim(),
    address: document.getElementById('f-address').value.trim(),
    time: document.getElementById('f-time').value.trim(),
    food: document.getElementById('f-food').value.trim()
  };
  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'saveSettings', settings: settings })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      msg.style.color = '#52b788';
      msg.textContent = 'Done! RSVP page is updated.';
    } else {
      msg.style.color = '#e07070';
      msg.textContent = 'Something went wrong. Try again.';
    }
  })
  .catch(function() {
    msg.style.color = '#e07070';
    msg.textContent = 'Could not connect. Check your internet.';
  });
}

function clearRsvps() {
  if (!confirm('Clear the entire RSVP list for the new game?')) return;
  var msg = document.getElementById('admin-msg');
  msg.style.color = 'rgba(245,240,232,0.5)';
  msg.textContent = 'Clearing...';
  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'clearRsvps' })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      msg.style.color = '#52b788';
      msg.textContent = 'RSVP list cleared. Fresh start!';
    }
  })
  .catch(function() {
    msg.style.color = '#e07070';
    msg.textContent = 'Could not connect. Try again.';
  });
}
</script>
</body>
</html>
