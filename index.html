<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Night RSVP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background-color: #1a472a;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,0,0,0.08) 40px, rgba(0,0,0,0.08) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.08) 40px, rgba(0,0,0,0.08) 41px);
    font-family: 'Inter', sans-serif;
    color: #f5f0e8;
    padding: 2rem 1rem 4rem;
  }

  .felt-table { max-width: 480px; margin: 0 auto; }

  .suits {
    text-align: center;
    font-size: 1.5rem;
    letter-spacing: 0.5rem;
    margin-bottom: 0.5rem;
    opacity: 0.6;
  }
  .suits .red { color: #e63946; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 900;
    text-align: center;
    color: #f5d87a;
    line-height: 1.1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    margin-bottom: 0.25rem;
  }

  .tagline {
    text-align: center;
    font-size: 0.8rem;
    color: rgba(245,240,232,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 1.75rem;
  }

  .info-card, .rsvp-card, .list-card {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(245,216,122,0.25);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }

  .info-row {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
    font-size: 0.95rem;
  }
  .info-row:last-child { margin-bottom: 0; }

  .info-label {
    color: #f5d87a;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
    font-weight: 600;
    min-width: 60px;
  }

  .info-value { color: #f5f0e8; }

  .rsvp-card h2, .list-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: #f5d87a;
    margin-bottom: 1rem;
  }

  input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(245,216,122,0.3);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    color: #f5f0e8;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    margin-bottom: 0.75rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input::placeholder { color: rgba(245,240,232,0.35); }
  input:focus { border-color: #f5d87a; }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.75rem; }

  .btn {
    padding: 0.7rem;
    border-radius: 8px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-in { background: #2d6a4f; color: #f5f0e8; border: 1px solid #52b788; }
  .btn-in:hover:not(:disabled) { opacity: 0.88; }
  .btn-out { background: rgba(180,40,40,0.4); color: #f5f0e8; border: 1px solid rgba(230,80,80,0.5); }
  .btn-out:hover:not(:disabled) { opacity: 0.88; }

  .btn-optout {
    width: 100%;
    background: transparent;
    color: rgba(245,240,232,0.45);
    border: 1px solid rgba(245,240,232,0.15);
    border-radius: 8px;
    padding: 0.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .btn-optout:hover { opacity: 0.7; }

  .message { font-size: 0.85rem; text-align: center; min-height: 1.2em; color: #f5d87a; margin-top: 0.5rem; }

  .attendee-list { list-style: none; }

  .attendee-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(245,240,232,0.08);
    font-size: 0.9rem;
  }
  .attendee-item:last-child { border-bottom: none; }

  .attendee-name { display: flex; align-items: center; gap: 0.5rem; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-in { background: #52b788; }
  .dot-out { background: #e63946; }

  .status-badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 20px; font-weight: 600; }
  .badge-in { background: rgba(82,183,136,0.2); color: #52b788; }
  .badge-out { background: rgba(230,57,70,0.2); color: #e07070; }

  .empty-state { text-align: center; color: rgba(245,240,232,0.35); font-size: 0.88rem; padding: 1rem 0; }

  .opted-out-section { margin-top: 1rem; }
  .opted-out-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(245,240,232,0.35); margin-bottom: 0.5rem; }
  .opted-out-item { font-size: 0.82rem; color: rgba(245,240,232,0.35); padding: 0.25rem 0; text-decoration: line-through; }

  .count-badge { display: inline-block; background: rgba(245,216,122,0.15); color: #f5d87a; font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 20px; margin-left: 0.5rem; font-weight: 600; }
</style>
</head>
<body>
<div class="felt-table">

  <div class="suits"><span class="red">♥</span> ♠ <span class="red">♦</span> ♣</div>
  <h1>Poker Night</h1>
  <p class="tagline">Morgan Hill Poker Society &mdash; Unofficial</p>

  <div class="info-card">
    <div class="info-row"><span class="info-label">When</span><span class="info-value" id="g-date">Loading...</span></div>
    <div class="info-row"><span class="info-label">Where</span><span class="info-value" id="g-host">Loading...</span></div>
    <div class="info-row"><span class="info-label">Time</span><span class="info-value" id="g-time">Loading...</span></div>
    <div class="info-row"><span class="info-label">Grub</span><span class="info-value" id="g-food">Loading...</span></div>
  </div>

  <div class="rsvp-card">
    <h2>Are you in?</h2>
    <input type="text" id="name-input" placeholder="Your name" maxlength="40" />
    <div class="btn-row">
      <button class="btn btn-in" id="btn-in" onclick="rsvp('in')">♠ I'm In</button>
      <button class="btn btn-out" id="btn-out" onclick="rsvp('out')">✕ Can't Make It</button>
    </div>
    <button class="btn-optout" onclick="optOut()">Remove me from future texts</button>
    <div class="message" id="msg"></div>
  </div>

  <div class="list-card">
    <h2>Who's Coming <span class="count-badge" id="count-badge">...</span></h2>
    <ul class="attendee-list" id="attendee-list">
      <li class="empty-state">Loading the table...</li>
    </ul>
    <div class="opted-out-section" id="opted-out-section" style="display:none;">
      <div class="opted-out-label">Opted out of texts</div>
      <div id="opted-out-list"></div>
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0-b_wivdSlEUA4OAjEzW3d3aP1bLbKUT4b554jtI8QNZtwWrHfmLWaSRPnDQocTonRg/exec';

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showMsg(text, color) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.style.color = color || '#f5d87a';
    setTimeout(() => { el.textContent = ''; }, 3500);
  }

  function setButtons(disabled) {
    document.getElementById('btn-in').disabled = disabled;
    document.getElementById('btn-out').disabled = disabled;
  }

  function getName() { return document.getElementById('name-input').value.trim(); }

  async function loadSettings() {
    try {
      const res = await fetch(SCRIPT_URL + '?action=getSettings');
      const data = await res.json();
      const s = data.settings || {};
      document.getElementById('g-date').textContent = s.date || 'TBD';
      document.getElementById('g-host').textContent = (s.host || '') + (s.address ? ' — ' + s.address : '');
      document.getElementById('g-time').textContent = s.time || '6:00 PM – 11:00 PM';
      document.getElementById('g-food').textContent = s.food ? s.food + ' (last winner, winner, something for dinner!)' : 'TBD';
    } catch(e) {}
  }

  async function loadList() {
    try {
      const res = await fetch(SCRIPT_URL + '?action=getAll');
      const data = await res.json();
      renderList(data);
    } catch(e) {
      document.getElementById('attendee-list').innerHTML = '<li class="empty-state">Could not load RSVPs.</li>';
    }
  }

  function renderList(data) {
    const list = document.getElementById('attendee-list');
    const optedOutSection = document.getElementById('opted-out-section');
    const optedOutList = document.getElementById('opted-out-list');
    const countBadge = document.getElementById('count-badge');
    const inCount = (data.attendees || []).filter(a => a.status === 'in').length;
    countBadge.textContent = inCount + ' in';
    if (!data.attendees || data.attendees.length === 0) {
      list.innerHTML = '<li class="empty-state">No RSVPs yet — don\'t be the last to fold.</li>';
    } else {
      list.innerHTML = data.attendees.map(a => `
        <li class="attendee-item">
          <span class="attendee-name">
            <span class="status-dot ${a.status === 'in' ? 'dot-in' : 'dot-out'}"></span>
            ${escHtml(a.name)}
          </span>
          <span class="status-badge ${a.status === 'in' ? 'badge-in' : 'badge-out'}">${a.status === 'in' ? 'In' : 'Out'}</span>
        </li>`).join('');
    }
    if (data.optedOut && data.optedOut.length > 0) {
      optedOutSection.style.display = 'block';
      optedOutList.innerHTML = data.optedOut.map(n => `<div class="opted-out-item">${escHtml(n)}</div>`).join('');
    } else {
      optedOutSection.style.display = 'none';
    }
  }

  async function rsvp(status) {
    const name = getName();
    if (!name) { showMsg('Enter your name first, friend.', '#e07070'); return; }
    setButtons(true);
    showMsg('Saving...', 'rgba(245,240,232,0.5)');
    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'rsvp', name, status, gameDate: document.getElementById('g-date').textContent })
      });
      const data = await res.json();
      if (data.success) {
        showMsg(status === 'in' ? "You're in! Don't be late." : "Noted. Your chips will be missed.");
        document.getElementById('name-input').value = '';
        await loadList();
      } else { showMsg('Something went wrong. Try again.', '#e07070'); }
    } catch(e) { showMsg('Could not save. Check your connection.', '#e07070'); }
    setButtons(false);
  }

  async function optOut() {
    const name = getName();
    if (!name) { showMsg('Enter your name to opt out.', '#e07070'); return; }
    setButtons(true);
    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'optout', name })
      });
      const data = await res.json();
      if (data.success) {
        showMsg("You're off the list. Take care out there.", 'rgba(245,240,232,0.5)');
        document.getElementById('name-input').value = '';
        await loadList();
      }
    } catch(e) { showMsg('Could not save. Try again.', '#e07070'); }
    setButtons(false);
  }

  loadSettings();
  loadList();
  setInterval(loadList, 30000);
</script>
</body>
</html>
